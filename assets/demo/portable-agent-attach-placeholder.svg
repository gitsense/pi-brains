<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Attach an agent video placeholder</title>
  <desc id="description">Placeholder for a video showing a recent Pi session being attached from the All Sessions panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset="1" stop-color="#111936"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6090ff"/><stop offset="1" stop-color="#a26cff"/></linearGradient>
  </defs>
  <rect width="1280" height="720" rx="30" fill="url(#bg)"/>
  <rect x="24" y="24" width="1232" height="672" rx="24" fill="none" stroke="#5474db" stroke-width="2"/>
  <text x="640" y="120" text-anchor="middle" fill="#8c9bbd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" letter-spacing="5">VIDEO PLACEHOLDER</text>
  <text x="640" y="215" text-anchor="middle" fill="url(#accent)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="700">Attach it to your work</text>
  <rect x="180" y="280" width="920" height="270" rx="20" fill="#0b1124" stroke="#627fdf" stroke-width="2"/>
  <text x="230" y="335" fill="#8ca8ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600">All Sessions</text>
  <circle cx="240" cy="405" r="14" fill="#65d18a"/>
  <rect x="275" y="386" width="360" height="34" rx="10" fill="#35456f"/>
  <rect x="875" y="380" width="150" height="48" rx="14" fill="#6688ff"/>
  <text x="950" y="412" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="600">Attach</text>
  <circle cx="240" cy="480" r="14" fill="#8c9bbd"/>
  <rect x="275" y="461" width="285" height="34" rx="10" fill="#2a3555"/>
  <text x="640" y="620" text-anchor="middle" fill="#dce5ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32">Find it by recent activity</text>
</svg>
