<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Start an independent agent video placeholder</title>
  <desc id="description">Placeholder for a video showing a split terminal and a second Pi session starting work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset="1" stop-color="#111936"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6090ff"/><stop offset="1" stop-color="#a26cff"/></linearGradient>
  </defs>
  <rect width="1280" height="720" rx="30" fill="url(#bg)"/>
  <rect x="24" y="24" width="1232" height="672" rx="24" fill="none" stroke="#5474db" stroke-width="2"/>
  <text x="640" y="120" text-anchor="middle" fill="#8c9bbd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" letter-spacing="5">VIDEO PLACEHOLDER</text>
  <text x="640" y="215" text-anchor="middle" fill="url(#accent)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="700">Start an agent anywhere</text>
  <rect x="115" y="285" width="500" height="245" rx="18" fill="#0b1124" stroke="#627fdf" stroke-width="2"/>
  <rect x="665" y="285" width="500" height="245" rx="18" fill="#0b1124" stroke="#9a70f0" stroke-width="2"/>
  <text x="155" y="340" fill="#8ca8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">main session</text>
  <text x="705" y="340" fill="#cda8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">new session</text>
  <text x="155" y="410" fill="#dce5ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">$ pi</text>
  <text x="705" y="410" fill="#dce5ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">$ pi</text>
  <text x="705" y="460" fill="#65d18a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">researching…</text>
  <text x="640" y="610" text-anchor="middle" fill="#dce5ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32">Independent session · focused context</text>
</svg>
