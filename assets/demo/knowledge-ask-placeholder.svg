<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Ask a knowledge agent video placeholder</title>
  <desc id="description">Placeholder thumbnail for a video showing a user asking a tracked knowledge agent a question.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="1" stop-color="#111936"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6090ff"/>
      <stop offset="1" stop-color="#a26cff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="30" fill="url(#background)"/>
  <rect x="24" y="24" width="1232" height="672" rx="24" fill="none" stroke="#5474db" stroke-width="2"/>
  <text x="640" y="135" text-anchor="middle" fill="#8c9bbd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" letter-spacing="5">VIDEO PLACEHOLDER</text>
  <text x="640" y="245" text-anchor="middle" fill="url(#accent)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="700">2. Ask</text>
  <g transform="translate(300 325)">
    <rect width="680" height="190" rx="24" fill="#0b1124" stroke="#8c75ff" stroke-width="2"/>
    <rect x="38" y="35" width="475" height="73" rx="22" fill="#1b2647"/>
    <text x="67" y="80" fill="#e7ecff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26">Where should the main agent look?</text>
    <rect x="38" y="128" width="565" height="20" rx="10" fill="#304064"/>
    <circle cx="628" cy="145" r="27" fill="#6688ff"/>
    <path d="M617 144 L637 134 L630 156 L624 147 Z" fill="#ffffff"/>
  </g>
  <text x="640" y="600" text-anchor="middle" fill="#dce5ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34">Ask the agent that already has the context</text>
  <circle cx="640" cy="655" r="25" fill="none" stroke="#8c75ff" stroke-width="2"/>
  <path d="M632 641 L652 655 L632 669 Z" fill="#8c75ff"/>
</svg>
