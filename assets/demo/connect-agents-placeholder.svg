  <path d="M445 410 C540 410 545 510 640 510" fill="none" stroke="#8a78ff" stroke-width="7" stroke-linecap="round"/>
  <path d="M620 274 L644 290 L620 306" fill="none" stroke="#6e8fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M620 494 L644 510 L620 526" fill="none" stroke="#8a78ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(675 225)">
    <rect width="465" height="175" rx="22" fill="#0b1124" stroke="#627fdf" stroke-width="2"/>
