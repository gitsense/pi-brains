<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Connect independent agents video placeholder</title>
  <desc id="description">Placeholder thumbnail showing a main agent asking two independent specialist agents to inspect their own workspaces.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="1" stop-color="#111936"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6090ff"/>
      <stop offset="1" stop-color="#a26cff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="30" fill="url(#background)"/>
  <rect x="24" y="24" width="1232" height="672" rx="24" fill="none" stroke="#5474db" stroke-width="2"/>
  <text x="640" y="105" text-anchor="middle" fill="#8c9bbd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" letter-spacing="5">VIDEO PLACEHOLDER</text>
