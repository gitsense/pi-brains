    <text x="35" y="86" fill="#7f90b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">workspace-a/</text>
    <rect x="35" y="111" width="230" height="14" rx="7" fill="#35456f"/>
    <rect x="35" y="139" width="175" height="14" rx="7" fill="#35456f"/>
    <text x="425" y="148" text-anchor="end" fill="#7ecf9a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">tokens ↑</text>
