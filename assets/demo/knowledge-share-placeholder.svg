<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Share knowledge with the main session video placeholder</title>
  <desc id="description">Placeholder thumbnail for a video showing a useful answer being shared with the main implementation session.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="1" stop-color="#111936"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6090ff"/>
      <stop offset="1" stop-color="#a26cff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="30" fill="url(#background)"/>
  <rect x="24" y="24" width="1232" height="672" rx="24" fill="none" stroke="#5474db" stroke-width="2"/>
  <text x="640" y="135" text-anchor="middle" fill="#8c9bbd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" letter-spacing="5">VIDEO PLACEHOLDER</text>
  <text x="640" y="245" text-anchor="middle" fill="url(#accent)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="700">3. Share</text>
  <g transform="translate(250 330)">
    <rect width="250" height="155" rx="22" fill="#0b1124" stroke="#627fdf" stroke-width="2"/>
    <text x="125" y="55" text-anchor="middle" fill="#8ca8ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25">Knowledge agent</text>
    <rect x="42" y="82" width="166" height="18" rx="9" fill="#35456f"/>
    <rect x="65" y="113" width="120" height="18" rx="9" fill="#35456f"/>
    <path d="M535 78 H625 M605 58 L625 78 L605 98" fill="none" stroke="#8c75ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="780" width="250" height="155" rx="22" fill="#0b1124" stroke="#9a70f0" stroke-width="2"/>
    <text x="905" y="55" text-anchor="middle" fill="#cda8ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25">Main session</text>
    <rect x="822" y="82" width="166" height="18" rx="9" fill="#4a386f"/>
    <rect x="845" y="113" width="120" height="18" rx="9" fill="#4a386f"/>
  </g>
  <text x="640" y="600" text-anchor="middle" fill="#dce5ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34">Carry the useful finding back to the work</text>
  <circle cx="640" cy="655" r="25" fill="none" stroke="#8c75ff" stroke-width="2"/>
  <path d="M632 641 L652 655 L632 669 Z" fill="#8c75ff"/>
</svg>
