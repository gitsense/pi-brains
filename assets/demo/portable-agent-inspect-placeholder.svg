<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Inspect an agent session video placeholder</title>
  <desc id="description">Placeholder for a video showing an attached agent's messages, tool calls, responses, and findings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset="1" stop-color="#111936"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6090ff"/><stop offset="1" stop-color="#a26cff"/></linearGradient>
  </defs>
  <rect width="1280" height="720" rx="30" fill="url(#bg)"/>
  <rect x="24" y="24" width="1232" height="672" rx="24" fill="none" stroke="#5474db" stroke-width="2"/>
  <text x="640" y="120" text-anchor="middle" fill="#8c9bbd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" letter-spacing="5">VIDEO PLACEHOLDER</text>
  <text x="640" y="215" text-anchor="middle" fill="url(#accent)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="700">Inspect and carry it forward</text>
  <rect x="135" y="280" width="690" height="300" rx="20" fill="#0b1124" stroke="#627fdf" stroke-width="2"/>
  <text x="180" y="330" fill="#8ca8ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25">Session history</text>
  <rect x="175" y="375" width="610" height="34" rx="10" fill="#35456f"/>
  <rect x="175" y="430" width="480" height="34" rx="10" fill="#2a3555"/>
  <rect x="175" y="485" width="555" height="34" rx="10" fill="#35456f"/>
  <path d="M855 430 H970 M940 400 L970 430 L940 460" fill="none" stroke="#8c75ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1010" y="350" width="130" height="160" rx="20" fill="#161d36" stroke="#9a70f0" stroke-width="2"/>
  <text x="1075" y="415" text-anchor="middle" fill="#cda8ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Useful</text>
  <text x="1075" y="450" text-anchor="middle" fill="#cda8ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">findings</text>
  <text x="640" y="640" text-anchor="middle" fill="#dce5ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32">Bring the result, not the whole history</text>
</svg>
